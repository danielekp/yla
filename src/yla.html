<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YLA, Your Local AI Assistant</title>
    <link rel="icon" type="image/png" href="media/assistant.png">

    <!-- Local style definition -->
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header class="header">
        <div class="header-title">
            <img src="media/assistant.png" alt="" class="header-icon">
            <h1>YLA, Your Local AI Assistant</h1>
        </div>
        <div class="header-center">
            <button class="model-pill hidden" id="modelPill" type="button" title="Change model">
                <span class="model-pill-label">Model</span>
                <span class="model-pill-name" id="modelPillName"></span>
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <path fill="currentColor" d="M7 10l5 5 5-5z"/>
                </svg>
            </button>
            <button class="connection-status" id="connectionStatus" type="button" title="Click to check the connection to Ollama">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text">Connecting...</span>
            </button>
        </div>
        <div class="header-buttons">
            <button class="theme-toggle-button" id="themeToggleButton" type="button" aria-label="Toggle dark mode">
                <img src="media/moon.png" alt="" class="theme-toggle-icon">
            </button>
        </div>
    </header>

    <section class="model-selector" id="modelSelector" aria-label="Model selection">
        <div class="model-selector-header">
            <h2>Model Selection</h2>
            <button class="model-selector-refresh" id="refreshModelsButton" type="button" title="Refresh the list of installed models">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                <span>Refresh</span>
            </button>
            <button class="model-selector-refresh" id="createModelButton" type="button" title="Build a custom model on top of an installed one" aria-expanded="false" aria-controls="createModelPanel">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                <span>Create model</span>
            </button>
        </div>
        <p class="model-selector-hint" id="modelSelectorHint">Choose the model you want to chat with.</p>

        <form class="create-model-panel hidden" id="createModelPanel" aria-label="Create a custom model" novalidate>
            <div class="create-model-head">
                <h3>Create a custom model</h3>
                <p>Saved in Ollama, exactly like <code>ollama create</code> with a Modelfile. The base model is downloaded first when it is not installed.</p>
            </div>
            <div class="create-model-grid">
                <label class="create-field">
                    <span>Name</span>
                    <input type="text" id="createModelName" name="name" autocomplete="off" spellcheck="false" placeholder="my-assistant" required>
                </label>
                <div class="create-field create-field-wide base-model-field">
                    <label for="createModelFrom">Base model</label>
                    <input type="text" id="createModelFrom" name="from" autocomplete="off" spellcheck="false" placeholder="Type to filter, or a full name like qwen3.5:35b" required>
                    <select id="baseModelList" size="7" aria-label="Installed models and Ollama library"></select>
                    <div class="base-model-variant hidden" id="baseModelVariantRow">
                        <label for="baseModelVariant">Variant</label>
                        <select id="baseModelVariant"></select>
                    </div>
                    <small id="baseModelInfo">Installed models and the <a href="https://ollama.com/library" target="_blank" rel="noopener">Ollama library</a> are listed below.</small>
                </div>
                <label class="create-field create-field-wide">
                    <span>System prompt</span>
                    <textarea id="createModelSystem" name="system" rows="5" placeholder="You are a helpful assistant…"></textarea>
                </label>
                <label class="create-field">
                    <span>Context window (tokens)</span>
                    <input type="number" id="createModelCtx" name="num_ctx" min="512" step="512" value="8192" inputmode="numeric">
                </label>
                <label class="create-field">
                    <span>Temperature</span>
                    <input type="number" id="createModelTemp" name="temperature" min="0" max="2" step="0.05" value="0.7">
                </label>
                <label class="create-field">
                    <span>Top K</span>
                    <input type="number" id="createModelTopK" name="top_k" min="1" max="200" step="1" value="40">
                </label>
                <label class="create-field">
                    <span>Top P</span>
                    <input type="number" id="createModelTopP" name="top_p" min="0" max="1" step="0.01" value="0.9">
                </label>
            </div>
            <div class="download-progress" id="createModelProgress"><div class="progress-bar"></div></div>
            <div class="create-model-footer">
                <div class="download-status" id="createModelStatus" role="status" aria-live="polite"></div>
                <div class="create-model-actions">
                    <button class="secondary-button" id="createModelCancel" type="button">Cancel</button>
                    <button class="primary-button" id="createModelSubmit" type="submit">Create model</button>
                </div>
            </div>
        </form>

        <div class="model-cards" id="modelCards"></div>
    </section>

    <main class="main-content hidden">
        <nav class="sidebar" id="sidebar" aria-label="Conversations">
            <div class="sidebar-new-chat">
                <button class="sidebar-new-chat-button" id="newChatButton" type="button">
                    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                        <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    <span>New Chat</span>
                </button>
            </div>
            <div class="conversation-list" id="conversationList">
                <!-- Conversations will be added here -->
            </div>
        </nav>
        <button class="sidebar-toggle-new sidebar-closed" id="toggleSidebarButton" type="button" aria-label="Toggle conversation list" aria-expanded="false">
            <svg class="toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
            </svg>
        </button>

        <div class="chat-section">
            <div class="chat-scroll-wrap">
                <div class="chat-scroll" id="chatScroll">
                    <div class="chat-container" id="chatContainer">
                        <!-- Chat messages will be added here -->
                    </div>
                </div>
                <button class="scroll-to-bottom hidden" id="scrollToBottomButton" type="button" aria-label="Scroll to latest message">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                    </svg>
                </button>
            </div>
            <div class="visually-hidden" id="chatStatus" role="status" aria-live="polite"></div>

            <div class="input-container" id="inputContainer">
                <div class="attachment-strip hidden" id="attachmentStrip" aria-label="Attached images"></div>
                <div class="input-wrapper">
                    <button class="attach-button" id="attachButton" type="button" aria-label="Attach images" title="Attach images (or paste / drop them into the message)">
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                    </button>
                    <input type="file" id="imageFileInput" accept="image/*" multiple hidden>
                    <textarea
                        class="message-input"
                        id="messageInput"
                        rows="1"
                        aria-label="Message"
                        placeholder="Type here.. (Enter to send, Shift+Enter for a new line)"></textarea>
                    <button class="send-button" id="sendButton" type="button" aria-label="Send message">
                        <svg class="send-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                            <!-- Custom speech bubble icon -->
                            <path class="send-icon-path" d="M5,4 h10 c2,0 3,0 3,2 v2 c0,2 1,3 3,3 c-1,1 -2,0 -3,2 v2 c0,2 -1,2 -3,2 h-10 c-2,0 -3,0 -3,-2 v-6 c0,-2 1,-3 3,-3 z M4,17 c-1,1 -2,2 -2,4 c2,-1 3,-2 4,-3 M9,20 a1,1 0 1 1 0,-2 a1,1 0 0 1 0,2 z M7,22 a0.7,0.7 0 1 1 0,-1.4 a0.7,0.7 0 0 1 0,1.4 z M5,23 a0.5,0.5 0 1 1 0,-1 a0.5,0.5 0 0 1 0,1 z"></path>
                        </svg>
                        <svg class="stop-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                            <rect x="6" y="6" width="12" height="12" rx="2" fill="white"></rect>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="init.js"></script>
</body>
</html>
